[workspace]
resolver = "2"
members = ["crates/isml-lsp", "crates/prost", "crates/sfcc-core", "crates/sfcc-dap"]

# Zed compiles an extension in place, with a `--target-dir` it hardcodes inside
# the extension's own directory. A crate that belongs to a workspace resolves
# against the workspace root instead, and the build stops being reproducible
# from Zed's side — so the two extension crates stay outside this one.
exclude = ["extensions/b2c-debug", "extensions/isml"]

[workspace.package]
license = "MIT"
repository = "https://github.com/salva-sm/sfcc-tools"

# A profile in a member crate is ignored; the workspace root is the only place
# cargo reads one from.
[profile.release]
opt-level = 2
