[package]
name = "sfcc-upload"
version = "0.10.0"
edition = "2024"
license.workspace = true
repository.workspace = true
authors = ["salva-sm"]
description = "Cartridge uploader for Salesforce B2C Commerce sandboxes"

[dependencies]
sfcc-core = { path = "../sfcc-core", features = ["webdav", "completions", "daemon"] }
anyhow = "1.0.104"
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
clap = { version = "4.6.6", features = ["derive"] }
clap_complete = "4.6.11"
futures = "0.3.34"
indicatif = "0.18.6"
notify = "8.2.0"
notify-debouncer-full = "0.7.0"
reqwest = { version = "0.13.4", default-features = false, features = ["native-tls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "fs", "signal", "sync", "time", "process"] }
tokio-tungstenite = { version = "0.30.0", default-features = false, features = ["connect"] }
walkdir = "2.5.0"
xxhash-rust = { version = "0.8.18", features = ["xxh3"] }
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }

[dev-dependencies]
sfcc-core = { path = "../sfcc-core", features = ["webdav", "completions", "daemon", "testing"] }
