[package]
name = "log-diff"
version = "0.9.2"
edition = "2024"
license.workspace = true
repository.workspace = true
authors = ["salva-sm"]
description = "Tell the errors a change introduced on a Salesforce B2C Commerce instance from the ones already known"

[dependencies]
sfcc-core = { path = "../sfcc-core", features = ["webdav", "completions"] }
anyhow = "1.0.104"
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
clap = { version = "4.6.6", features = ["derive", "env"] }
clap_complete = "4.6.11"
notify-rust = "4.18.0"
regex = "1.13.1"
reqwest = { version = "0.13.4", default-features = false, features = ["native-tls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "time"] }
xxhash-rust = { version = "0.8.18", features = ["xxh3"] }
