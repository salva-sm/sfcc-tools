[package]
name = "log-diff"
version = "0.21.0"
edition = "2024"
license.workspace = true
repository.workspace = true
authors = ["salva-sm"]
description = "Tell the errors a change introduced on a Salesforce B2C Commerce instance from the ones already known"

[dependencies]
sfcc-core = { path = "../sfcc-core", features = ["webdav", "completions", "daemon"] }
anyhow.workspace = true
chrono.workspace = true
clap = { workspace = true, features = ["derive", "env"] }
clap_complete.workspace = true
notify-rust = "4.18.0"
regex = "1.13.1"
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time"] }
xxhash-rust.workspace = true

[dev-dependencies]
flate2.workspace = true
sfcc-core = { path = "../sfcc-core", features = ["webdav", "completions", "daemon", "testing"] }
