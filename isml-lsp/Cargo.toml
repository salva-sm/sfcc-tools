[package]
name = "isml-lsp"
version = "0.1.2"
edition = "2021"
description = "Go-to-definition for ISML template paths, SFCC require() paths and Resource.msg keys"
license = "MIT"

[dependencies]
lsp-server = "0.7"
lsp-types = "0.94"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 2
