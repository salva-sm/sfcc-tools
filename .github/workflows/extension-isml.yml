name: Extension zip (isml)

# Reproduces Zed's `install dev extension` build (crates/extension/src/extension_builder.rs).
# Zed also strips custom sections, a size optimisation only: `zed:api-version` survives.
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  # Matches the version Zed 0.2x downloads for itself.
  WASI_SDK_VERSION: "25"

jobs:
  zip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read the extension id and version
        id: manifest
        run: |
          sed -nE 's/^id = "(.*)"$/id=\1/p;s/^version = "(.*)"$/version=\1/p' \
            extensions/isml/extension.toml | head -2 >> "$GITHUB_OUTPUT"

      - name: Build the extension
        run: |
          rustup target add wasm32-wasip2
          cargo build --release --target wasm32-wasip2
        working-directory: extensions/isml

      # Checked before unpacking: piped into tar, a truncated download is only `not in gzip format`.
      - name: Install wasi-sdk
        run: |
          url="https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-${WASI_SDK_VERSION}/wasi-sdk-${WASI_SDK_VERSION}.0-x86_64-linux.tar.gz"
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 3 -o wasi-sdk.tar.gz "$url"
          file wasi-sdk.tar.gz | grep -q gzip \
            || { echo "not an archive:"; head -c 200 wasi-sdk.tar.gz; exit 1; }
          tar -xzf wasi-sdk.tar.gz
          echo "$PWD/wasi-sdk-${WASI_SDK_VERSION}.0-x86_64-linux/bin" >> "$GITHUB_PATH"

      - name: Build the grammar
        run: |
          mkdir -p payload/grammars
          clang -fPIC -shared -Os -Wl,--export=tree_sitter_isml \
            -o payload/grammars/isml.wasm \
            -I grammar/src grammar/src/parser.c grammar/src/scanner.c

      - name: Assemble the package
        env:
          ID: ${{ steps.manifest.outputs.id }}
        run: |
          mkdir -p "stage/$ID"
          cp extensions/isml/extension.toml "stage/$ID/"
          cp extensions/isml/target/wasm32-wasip2/release/zed_isml.wasm "stage/$ID/extension.wasm"
          cp -r payload/grammars "stage/$ID/"
          cp -r extensions/isml/languages "stage/$ID/"
          cp LICENSE README.md "stage/$ID/"
          cp tools/packaging/install.ps1 tools/packaging/install.cmd stage/
          ( cd stage && zip -qr "../$ID-${{ steps.manifest.outputs.version }}.zip" . )
          unzip -l "$ID-${{ steps.manifest.outputs.version }}.zip"

      # A green run has to mean the zip is usable, since nobody reads the logs.
      - name: Check the package
        env:
          ID: ${{ steps.manifest.outputs.id }}
        run: |
          for file in extension.toml extension.wasm grammars/isml.wasm languages/isml/config.toml; do
            test -f "stage/$ID/$file" || { echo "missing $file"; exit 1; }
          done
          for helper in install.ps1 install.cmd; do
            test -f "stage/$helper" || { echo "missing $helper"; exit 1; }
          done
          grep -qa 'zed:api-version' "stage/$ID/extension.wasm" \
            || { echo 'extension.wasm has no zed:api-version section'; exit 1; }
          grep -qa 'tree_sitter_isml' "stage/$ID/grammars/isml.wasm" \
            || { echo 'the grammar does not export tree_sitter_isml'; exit 1; }

      - uses: actions/upload-artifact@v4
        with:
          name: extension-isml-zip
          path: "*.zip"

      - name: Attach it to the release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: "*.zip"
