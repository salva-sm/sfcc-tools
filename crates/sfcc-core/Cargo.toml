[package]
name = "sfcc-core"
version = "0.12.0"
edition = "2024"
license.workspace = true
repository.workspace = true
authors = ["salva-sm"]
description = "What every SFCC tool here needs: the sandbox credentials in dw.json, what may be written to, and the instance log"

[features]
# Off by default: the debug adapter only needs dw.json, not an async HTTP stack.
webdav = ["dep:chrono", "dep:flate2", "dep:futures", "dep:reqwest", "dep:tokio"]
testing = ["webdav", "tokio/net", "tokio/io-util", "tokio/rt"]
completions = ["dep:clap", "dep:clap_complete"]
daemon = ["dep:libc"]
ocapi = ["dep:reqwest", "dep:tokio"]
# The Sandbox API client; what a state allows needs no HTTP and is always there.
ods = ["dep:reqwest", "dep:tokio"]

[dependencies]
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
clap = { workspace = true, optional = true }
clap_complete = { workspace = true, optional = true }
chrono = { workspace = true, optional = true }
flate2 = { workspace = true, optional = true }
futures = { workspace = true, optional = true }
reqwest = { workspace = true, optional = true }
tokio = { workspace = true, features = ["sync", "time"], optional = true }

[target."cfg(unix)".dependencies]
libc = { version = "0.2.189", optional = true }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[[test]]
name = "logs"
required-features = ["testing"]
