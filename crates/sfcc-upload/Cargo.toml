[package]
name = "sfcc-upload"
version = "0.14.0"
edition = "2024"
license.workspace = true
repository.workspace = true
authors = ["salva-sm"]
description = "Cartridge uploader for Salesforce B2C Commerce sandboxes"

[dependencies]
sfcc-core = { path = "../sfcc-core", features = ["webdav", "ocapi", "ods", "completions", "daemon"] }
anyhow.workspace = true
chrono.workspace = true
clap = { workspace = true, features = ["derive"] }
clap_complete.workspace = true
futures.workspace = true
indicatif = "0.18.6"
notify = "8.2.0"
notify-debouncer-full = "0.7.0"
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "fs", "signal", "sync", "time", "process"] }
tokio-tungstenite = { version = "0.30.0", default-features = false, features = ["connect"] }
walkdir = "2.5.0"
xxhash-rust.workspace = true
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }

[dev-dependencies]
sfcc-core = { path = "../sfcc-core", features = ["webdav", "ocapi", "ods", "completions", "daemon", "testing"] }
