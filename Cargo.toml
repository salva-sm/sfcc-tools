[package]
name = "prost"
version = "0.2.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
clap = { version = "4.6.6", features = ["derive"] }
futures = "0.3.34"
indicatif = "0.18.6"
notify = "8.2.0"
notify-debouncer-full = "0.7.0"
reqwest = { version = "0.13.4", default-features = false, features = ["native-tls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "fs", "signal", "sync", "time", "process"] }
tokio-tungstenite = { version = "0.30.0", default-features = false, features = ["connect"] }
walkdir = "2.5.0"
xxhash-rust = { version = "0.8.18", features = ["xxh3"] }
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_System_Threading", "Win32_Foundation"] }

[target."cfg(unix)".dependencies]
libc = "0.2.189"
