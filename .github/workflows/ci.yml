name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  language-server:
    name: isml-lsp
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cargo fmt --check -p isml-lsp
      - run: cargo clippy -p isml-lsp -- -D warnings
      - run: cargo test -p isml-lsp

  uploader:
    name: sfcc-upload, log-diff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cargo fmt --check -p sfcc-upload -p log-diff -p sfcc-core -p sfcc-dap
      - run: cargo test -p sfcc-upload -p log-diff -p sfcc-dap
      # On its own, so the tests of the webdav feature run and the crate is
      # also checked without it, the way the debug adapter builds it.
      - run: cargo test -p sfcc-core --all-features
      - run: cargo clippy -p sfcc-core
      - run: cargo clippy -p sfcc-dap -p sfcc-core -p log-diff --all-features -- -D warnings

  grammar:
    name: tree-sitter-isml
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: grammar
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci || npm install
      # Fails if the committed parser is stale.
      - run: |
          npx tree-sitter generate
          git diff --exit-code src/
      - run: bash check.sh

  extension:
    name: extension (wasm)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The same target the Zed extension registry builds with.
      - run: rustup target add wasm32-wasip2
      - run: cargo build --release --target wasm32-wasip2
        working-directory: extensions/isml
