[package]
name = "sfcc-core"
version = "0.4.0"
edition = "2024"
license.workspace = true
repository.workspace = true
authors = ["salva-sm"]
description = "What every SFCC tool here needs: the sandbox credentials in dw.json, what may be written to, and the instance log"

[features]
# WebDAV and the log reader built on it. Off by default: the debug adapter
# only needs dw.json, and has no reason to carry an async HTTP stack.
webdav = ["dep:chrono", "dep:flate2", "dep:futures", "dep:reqwest", "dep:tokio"]
# A WebDAV server in memory, for the tests of the tools built on this one.
testing = ["webdav", "tokio/net", "tokio/io-util", "tokio/rt"]
# Tab completion for the command-line tools, installed by the tools themselves.
completions = ["dep:clap", "dep:clap_complete"]

[dependencies]
anyhow = "1.0.104"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4.6.6", optional = true }
clap_complete = { version = "4.6.11", optional = true }
chrono = { version = "0.4.45", default-features = false, features = ["clock"], optional = true }
flate2 = { version = "1.1.10", optional = true }
futures = { version = "0.3.34", optional = true }
reqwest = { version = "0.13.4", default-features = false, features = ["native-tls"], optional = true }
tokio = { version = "1.53.1", features = ["sync", "time"], optional = true }

[dev-dependencies]
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread"] }

[[test]]
name = "logs"
required-features = ["testing"]
