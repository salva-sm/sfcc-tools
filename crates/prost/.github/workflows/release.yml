name: Release

# Attaches prebuilt binaries to the release for a `v*` tag, so installing prost
# never requires a Rust toolchain. Assets are named without the version, which
# keeps a stable "latest" download URL:
#   https://github.com/salva-sm/prost/releases/latest/download/prost-x86_64-windows.exe
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  # The committed .cargo/config.toml points target-dir at a Windows path that
  # only exists on the author's machine.
  CARGO_TARGET_DIR: target

jobs:
  build:
    name: ${{ matrix.asset }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            asset: prost-x86_64-linux.tar.gz
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            asset: prost-aarch64-linux.tar.gz
          # Both macOS binaries come off the ARM runner: Xcode ships the two
          # SDKs, and the Intel `macos-13` runners are being retired.
          - os: macos-latest
            target: x86_64-apple-darwin
            asset: prost-x86_64-macos.tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            asset: prost-aarch64-macos.tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            asset: prost-x86_64-windows.exe
    steps:
      - uses: actions/checkout@v4
      - run: rustup target add ${{ matrix.target }}
      - run: cargo build --release --target ${{ matrix.target }}

      # Only the finished artifact, never the intermediate libraries: stripping
      # a proc-macro dylib takes its metadata with it.
      - name: Package (unix)
        if: runner.os != 'Windows'
        run: |
          strip "target/${{ matrix.target }}/release/prost"
          tar -czf "${{ matrix.asset }}" -C "target/${{ matrix.target }}/release" prost

      - name: Package (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Copy-Item "target/${{ matrix.target }}/release/prost.exe" "${{ matrix.asset }}"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: prost-*
          generate_release_notes: true
