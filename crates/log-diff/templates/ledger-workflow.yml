# .github/workflows/log-diff.yml in the sfcc-log-ledger repository.
#
# Runs on every DEV deploy (a repository_dispatch sent by Jenkins) and on a
# schedule in between, because a deploy's errors only show up once somebody
# uses what it shipped. Each run reads the DEV log since the last one, commits
# ledger.json, and posts what is new to Teams.
#
# Setup, secrets included: crates/log-diff/README.md in salva-sm/sfcc-tools.
#
# Secrets:
#   SFCC_DEV_HOSTNAME                     the DEV instance host
#   SFCC_DEV_USERNAME, SFCC_DEV_PASSWORD  a Business Manager user and its WebDAV access key
#     - or -
#   SFCC_DEV_CLIENT_ID, SFCC_DEV_CLIENT_SECRET  an API client with WebDAV read on /logs
#   TEAMS_WEBHOOK                         a Teams Workflows (or incoming) webhook URL
#   DEPLOY_SIGNAL_TOKEN                   optional, see "Learn deploys" below
#
# Variables (Settings -> Secrets and variables -> Actions -> Variables), all
# optional, for learning deploys from another workflow instead of a dispatch:
#   DEPLOY_SIGNAL_REPO       owner/repo whose workflow runs after every DEV deploy
#   DEPLOY_SIGNAL_WORKFLOW   that workflow's file name, e.g. e2e.yaml
#   DEPLOY_SIGNAL_PATTERN    an extended regex on the run's title whose first
#                            group is the deployed sha, e.g. `development .* post-deploy ([0-9a-f]{7,40})`
# or, when every build is deployed to a code version of its own:
#   CODE_VERSION_PATTERN     an extended regex on the code version's name whose first
#                            group is the build number, e.g. `^b([0-9]+)_`
#   SOURCE_REPO              owner/repo of the SFCC code, to name each build's commit
#   SOURCE_BRANCH            the branch DEV is deployed from (default: develop)
# DEPLOY_SIGNAL_TOKEN then needs Contents: read-only on SOURCE_REPO.
name: log-diff

on:
  repository_dispatch:
    types: [sfcc-deploy]
  schedule:
    # Every 30 minutes through the working day, Monday to Friday (UTC).
    - cron: "*/30 6-19 * * 1-5"
  workflow_dispatch:
    inputs:
      baseline_days:
        description: "First run only: days of DEV log before today to learn from (ignored once ledger.json exists)"
        required: false
        default: "14"

# Two runs writing the ledger at once would each lose the other's update.
concurrency:
  group: ledger
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install log-diff
        run: |
          curl -fsSL https://github.com/salva-sm/sfcc-tools/releases/latest/download/log-diff-x86_64-linux.tar.gz \
            | tar -xz -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      # Outside the checkout, so it can never be committed. dw.json needs a
      # cartridges folder next to it even though nothing is uploaded.
      - name: dw.json from secrets
        env:
          HOST: ${{ secrets.SFCC_DEV_HOSTNAME }}
          USERNAME: ${{ secrets.SFCC_DEV_USERNAME }}
          PASSWORD: ${{ secrets.SFCC_DEV_PASSWORD }}
          CLIENT_ID: ${{ secrets.SFCC_DEV_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.SFCC_DEV_CLIENT_SECRET }}
        run: |
          mkdir -p "$RUNNER_TEMP/sfcc/cartridges"
          jq -n --arg hostname "$HOST" --arg username "$USERNAME" --arg password "$PASSWORD" \
                --arg id "$CLIENT_ID" --arg secret "$CLIENT_SECRET" \
            '{hostname: $hostname}
             + (if $username != "" then {username: $username, password: $password} else {} end)
             + (if $id != "" then {"client-id": $id, "client-secret": $secret} else {} end)' \
            > "$RUNNER_TEMP/sfcc/dw.json"

      # When the deploy pipeline already tells another repository - an E2E suite,
      # say - that workflow's runs are the list of deploys: each one's title names
      # the sha and its start is when the deploy finished. Nothing in the deploy
      # pipeline or the SFCC repository has to change. `log-diff deploy` skips a
      # sha it already has, so the last runs are fed in every time.
      - name: Learn deploys
        if: vars.DEPLOY_SIGNAL_REPO != ''
        env:
          GH_TOKEN: ${{ secrets.DEPLOY_SIGNAL_TOKEN }}
          REPO: ${{ vars.DEPLOY_SIGNAL_REPO }}
          WORKFLOW: ${{ vars.DEPLOY_SIGNAL_WORKFLOW }}
          PATTERN: ${{ vars.DEPLOY_SIGNAL_PATTERN }}
        run: |
          gh api "repos/$REPO/actions/workflows/$WORKFLOW/runs?event=repository_dispatch&per_page=30" \
            --jq '.workflow_runs | sort_by(.created_at) | .[] | [.created_at, .display_title] | @tsv' |
          while IFS=$'\t' read -r at title; do
            if [[ "$title" =~ $PATTERN ]]; then
              log-diff deploy --state ledger.json --sha "${BASH_REMATCH[1]}" --at "$at" --color never
            fi
          done

      # When every build is deployed to a code version of its own - `b4378_...` -
      # the instance itself lists the deploys: one code version each, written
      # when it went up. Its commit is the last one on the branch before then,
      # which is right unless something was merged while the build ran.
      - name: Learn deploys from the code versions
        if: vars.CODE_VERSION_PATTERN != ''
        env:
          GH_TOKEN: ${{ secrets.DEPLOY_SIGNAL_TOKEN }}
          PATTERN: ${{ vars.CODE_VERSION_PATTERN }}
          SOURCE_REPO: ${{ vars.SOURCE_REPO }}
          SOURCE_BRANCH: ${{ vars.SOURCE_BRANCH || 'develop' }}
        run: |
          log-diff code-versions --config "$RUNNER_TEMP/sfcc/dw.json" |
          while IFS=$'\t' read -r name at; do
            [[ "$name" =~ $PATTERN ]] || continue
            build="${BASH_REMATCH[1]}"
            sha="$name"
            if [ -n "$SOURCE_REPO" ]; then
              commit=$(gh api "repos/$SOURCE_REPO/commits?sha=$SOURCE_BRANCH&until=$at&per_page=1" \
                --jq '.[0].sha' 2>/dev/null || true)
              [ -n "$commit" ] && sha="$commit"
            fi
            log-diff deploy --state ledger.json --sha "$sha" --build "$build" --at "$at" --color never
          done

      - name: Read the DEV log
        env:
          SHA: ${{ github.event.client_payload.sha }}
          BUILD: ${{ github.event.client_payload.build_number }}
          DEPLOYED_AT: ${{ github.event.client_payload.deployed_at }}
          BASELINE_DAYS: ${{ inputs.baseline_days }}
          # Where the suspects of a deploy can be read: the repository holding the
          # SFCC code. Optional - it only adds a link to the Teams card.
          LOG_DIFF_COMPARE_URL: https://github.com/<owner>/<sfcc-repo>/compare/{from}...{to}
        run: |
          args=()
          [ -n "$SHA" ] && args+=(--sha "$SHA")
          [ -n "$SHA" ] && [ -n "$BUILD" ] && args+=(--build "$BUILD")
          [ -n "$SHA" ] && [ -n "$DEPLOYED_AT" ] && args+=(--at "$DEPLOYED_AT")
          [ -n "$BASELINE_DAYS" ] && args+=(--baseline-days "$BASELINE_DAYS")
          log-diff run --config "$RUNNER_TEMP/sfcc/dw.json" --state ledger.json \
            --report "$RUNNER_TEMP/new.json" "${args[@]}"

      - name: Commit the ledger
        env:
          SHA: ${{ github.event.client_payload.sha }}
        run: |
          git config user.name "log-diff"
          git config user.email "log-diff@users.noreply.github.com"
          git add ledger.json
          if ! git diff --cached --quiet; then
            git commit -m "ledger: ${SHA:-scheduled read}"
            git push
          fi

      - name: Tell Teams
        env:
          LOG_DIFF_WEBHOOK: ${{ secrets.TEAMS_WEBHOOK }}
        run: log-diff notify --report "$RUNNER_TEMP/new.json"
